name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build + runtime dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools pybind11 cmake ninja
          pip install matplotlib numpy pyinstaller
          pip install ruptura

      - name: Smoke-test that RUPTURA imports and computes
        run: python app.py --selftest

      - name: Build executable
        run: pyinstaller --clean --noconfirm ruptura_studio.spec

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: RUPTURA-Studio-Windows
          path: dist/RUPTURA-Studio.exe
          if-no-files-found: error
